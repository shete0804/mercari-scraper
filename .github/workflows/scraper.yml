name: Mercari Scraper

on:
  schedule:
    # UTC 基準。 JST では 09:00 / 15:00 / 21:00 / 翌 03:00 に相当
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python mercari_scraper.py

      - name: Commit results CSV
        if: always()
        run: |
          [ -f results/mercari.csv ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/mercari.csv
          if git diff --cached --quiet; then
            echo "CSV に変更なし"
          else
            git commit -m "chore: update Mercari results CSV [skip ci]"
            git pull --rebase -q
            git push
          fi
