name: Detect Missed Listings

# 取りこぼし検知：今の取得が条件で落とした出品を、ゆるい条件で探し直して Discord に知らせる（設定は書き換えない）
# 日本時間 3:10 と 4:40（UTC 18:10 と 19:40）。この時間は PC のタスクと既存の定期実行を休ませている
on:
  schedule:
    - cron: '10 18 * * *'
    - cron: '40 19 * * *'
  workflow_dispatch:

concurrency:
  group: detect-missed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python detect_missed.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/detect_seen.json results/detect_latest.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -q -m "chore: update missed-listing detection [skip ci]"
            git pull --rebase -q && git push -q
          fi